<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração de exploração geológica">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b242b"/>
      <stop offset="0.55" stop-color="#0d2f35"/>
      <stop offset="1" stop-color="#123f42"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="70%">
      <stop offset="0" stop-color="#14b8a6" stop-opacity=".38"/>
      <stop offset="0.55" stop-color="#0f766e" stop-opacity=".08"/>
      <stop offset="1" stop-color="#0b242b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strata1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5c5a"/>
      <stop offset="1" stop-color="#123c3f"/>
    </linearGradient>
    <linearGradient id="strata2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6f68"/>
      <stop offset="1" stop-color="#174a4b"/>
    </linearGradient>
    <linearGradient id="strata3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c8579"/>
      <stop offset="1" stop-color="#1e5a57"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="rig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb7b4"/>
      <stop offset="1" stop-color="#5c7674"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#7dd3c7" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .glow { animation: breathe 7s ease-in-out infinite; }
    .contours { animation: drift 18s ease-in-out infinite alternate; }
    .contours path { stroke-dasharray: 14 10; animation: flow 40s linear infinite; }
    .contours path:nth-child(even) { animation-direction: reverse; animation-duration: 52s; }
    .rings ellipse { stroke-dasharray: 22 12; animation: flow 30s linear infinite; }
    .rings ellipse:nth-child(even) { animation-direction: reverse; animation-duration: 24s; }
    .ping { fill: none; stroke: #5eead4; stroke-width: 2; transform-box: fill-box; transform-origin: center; opacity: 0; animation: ping 4.5s ease-out infinite; }
    .ping--2 { animation-delay: 1.5s; }
    .ping--3 { animation-delay: 3s; }
    .cable { animation: drill 1.2s linear infinite; }
    .cabin-light { animation: flicker 5s ease-in-out infinite; }
    .vein { stroke-dasharray: 60 340; animation: shimmer 6s ease-in-out infinite; }
    .ore circle { transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out infinite; }
    .ore circle:nth-child(2) { animation-delay: .5s; } .ore circle:nth-child(3) { animation-delay: 1s; }
    .ore circle:nth-child(4) { animation-delay: 1.5s; } .ore circle:nth-child(5) { animation-delay: 2s; }
    .ore circle:nth-child(6) { animation-delay: 2.5s; }
    .lens { animation: breathe 5s ease-in-out infinite; }
    .needle { transform-box: view-box; transform-origin: 0 0; animation: sway 6s ease-in-out infinite; }
    .particles circle { animation: rise 12s ease-in-out infinite; }
    .particles circle:nth-child(2) { animation-delay: -2s; animation-duration: 15s; }
    .particles circle:nth-child(3) { animation-delay: -4s; animation-duration: 11s; }
    .particles circle:nth-child(4) { animation-delay: -6s; animation-duration: 14s; }
    .particles circle:nth-child(5) { animation-delay: -8s; animation-duration: 13s; }
    .particles circle:nth-child(6) { animation-delay: -10s; animation-duration: 16s; }
    .particles circle:nth-child(n+7) { animation-delay: -5s; animation-duration: 17s; }
    @keyframes breathe { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }
    @keyframes drift { from { transform: translateX(-18px); } to { transform: translateX(18px); } }
    @keyframes flow { to { stroke-dashoffset: -480; } }
    @keyframes ping { 0% { transform: scale(.2); opacity: .55; } 80% { opacity: 0; } 100% { transform: scale(1.6); opacity: 0; } }
    @keyframes drill { to { stroke-dashoffset: -10; } }
    @keyframes flicker { 0%, 100% { opacity: .5; } 45% { opacity: .75; } 50% { opacity: .4; } 55% { opacity: .7; } }
    @keyframes shimmer { 0% { stroke-dashoffset: 400; } 100% { stroke-dashoffset: 0; } }
    @keyframes twinkle { 0%, 100% { opacity: .55; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.25); } }
    @keyframes sway { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: .8; } 100% { transform: translateY(-140px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="900" height="1200" fill="url(#bg)"/>
  <rect width="900" height="1200" fill="url(#grid)"/>
  <rect class="glow" width="900" height="1200" fill="url(#glow)"/>

  <!-- Topographic contour lines -->
  <g class="contours" fill="none" stroke="#5eead4" stroke-opacity=".13" stroke-width="1.4">
    <path d="M-40 250c120-70 210-40 300 10s190 80 330 10 240-40 360 30"/>
    <path d="M-40 300c130-66 220-32 310 20s185 74 320 10 250-44 370 34"/>
    <path d="M-40 352c140-60 230-24 320 30s180 66 312 8 256-48 376 38"/>
    <path d="M-40 408c150-54 240-16 330 40s174 58 304 6 262-52 382 42"/>
    <path d="M-40 468c160-48 250-8 340 50s168 50 296 4 268-56 388 46"/>
    <path d="M-40 532c170-42 260 0 350 60s162 42 288 2 274-60 394 50"/>
    <path d="M-40 600c180-36 270 8 360 70s156 34 280 0 280-64 400 54"/>
  </g>

  <g class="rings" fill="none" stroke="#f59e0b" stroke-opacity=".16" stroke-width="1.6">
    <ellipse cx="660" cy="330" rx="150" ry="62" transform="rotate(-14 660 330)"/>
    <ellipse cx="660" cy="330" rx="108" ry="42" transform="rotate(-14 660 330)"/>
    <ellipse cx="660" cy="330" rx="66" ry="24" transform="rotate(-14 660 330)"/>
    <ellipse cx="250" cy="470" rx="120" ry="46" transform="rotate(10 250 470)"/>
    <ellipse cx="250" cy="470" rx="78" ry="28" transform="rotate(10 250 470)"/>
  </g>

  <!-- Distant ridge -->
  <path d="M0 690 120 610 230 660 340 575 470 650 590 585 720 655 820 600 900 640V760H0z" fill="#0e3237" opacity=".9"/>

  <!-- Geological strata -->
  <g>
    <path d="M0 720c120-40 240-40 360 0s240 40 360 0 120-20 180-6v120c-70-16-120 6-190 24s-240 40-360 0-240-40-350 4V720z" fill="url(#strata1)"/>
    <path d="M0 812c110-34 250-30 370 10s240 34 350-2 120-14 180 2v128c-66-18-118 4-188 22s-240 38-360-2-240-38-352 6V812z" fill="url(#strata2)"/>
    <path d="M0 920c120-30 240-24 360 16s240 30 350-6 130-10 190 8v130c-70-20-120 2-190 20s-240 34-360-6-240-34-350 10V920z" fill="url(#strata3)"/>
    <path d="M0 1030c110-26 250-18 370 22s240 24 350-12 130-6 180 12v148H0z" fill="#0a2a30"/>
  </g>

  <!-- Strata texture lines -->
  <g fill="none" stroke="#bdf5e8" stroke-opacity=".12" stroke-width="1.2">
    <path d="M0 780c120-32 240-32 360 8s240 34 360-2 120-16 180-2"/>
    <path d="M0 860c110-26 250-20 370 20s240 28 350-8 120-10 180 6"/>
    <path d="M0 968c120-24 240-16 360 24s240 24 350-12 130-6 190 12"/>
    <path d="M0 1082c110-18 250-10 370 30s240 18 350-18 130 0 180 18"/>
  </g>

  <!-- Mineralized lens -->
  <ellipse class="lens" cx="620" cy="900" rx="130" ry="42" fill="#f59e0b" opacity=".13" filter="url(#soft)"/>
  <path d="M500 900c40-26 80-34 120-26s70 30 110 22 60-20 90-12" fill="none" stroke="url(#copper)" stroke-width="3" stroke-linecap="round" opacity=".45"/>
  <path class="vein" d="M500 900c40-26 80-34 120-26s70 30 110 22 60-20 90-12" fill="none" stroke="#fde68a" stroke-width="3.5" stroke-linecap="round"/>
  <g class="ore" fill="#fbbf24">
    <circle cx="548" cy="892" r="3.2"/><circle cx="586" cy="902" r="2.4"/><circle cx="624" cy="894" r="3.8"/>
    <circle cx="664" cy="906" r="2.6"/><circle cx="702" cy="896" r="3.4"/><circle cx="742" cy="904" r="2.2"/>
  </g>

  <!-- Drill rig -->
  <g transform="translate(250 470)">
    <ellipse cx="0" cy="270" rx="150" ry="26" fill="#04181c" opacity=".55"/>
    <!-- base -->
    <path d="M-90 250h180l-14 26H-76z" fill="#274a4c"/>
    <path d="M-70 214h140v36H-70z" fill="#1c3a3d"/>
    <!-- mast -->
    <path d="M-34 214 0 18 34 214" fill="none" stroke="url(#rig)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M-24 214 0 54 24 214" fill="none" stroke="#7e9996" stroke-width="2.5" opacity=".8"/>
    <g stroke="#7e9996" stroke-width="2" opacity=".85">
      <path d="M-30 176h60M-26 144h52M-21 112h42M-16 80h32"/>
      <path d="M-26 144 22 112M-22 112 18 80M-17 80 14 54"/>
    </g>
    <!-- sinal de sondagem -->
    <circle class="ping" cx="0" cy="18" r="70"/>
    <circle class="ping ping--2" cx="0" cy="18" r="70"/>
    <circle class="ping ping--3" cx="0" cy="18" r="70"/>
    <!-- crown -->
    <circle cx="0" cy="18" r="9" fill="#0b242b" stroke="#9fb7b4" stroke-width="3"/>
    <path d="M-16 30h32" stroke="#9fb7b4" stroke-width="4" stroke-linecap="round"/>
    <!-- cable -->
    <path class="cable" d="M0 30v184" stroke="#d6e4e1" stroke-width="2" stroke-dasharray="5 5" opacity=".8"/>
    <!-- cabin -->
    <path d="M-86 214h50v-34h-50z" fill="#16383b"/>
    <path class="cabin-light" d="M-80 206h38v-18h-38z" fill="#f59e0b" opacity=".5"/>
    <circle cx="-62" cy="222" r="12" fill="#0b242b" stroke="#7e9996" stroke-width="3"/>
    <circle cx="58" cy="222" r="12" fill="#0b242b" stroke="#7e9996" stroke-width="3"/>
  </g>

  <!-- Core samples -->
  <g transform="translate(690 1030) rotate(-18)">
    <rect x="-14" y="-120" width="28" height="120" rx="10" fill="#1d5c5a" stroke="#7dd3c7" stroke-opacity=".4"/>
    <rect x="-14" y="-96" width="28" height="26" fill="#2a6f68"/>
    <rect x="-14" y="-52" width="28" height="18" fill="#f59e0b" opacity=".85"/>
    <rect x="-14" y="-22" width="28" height="14" fill="#3c8579"/>
    <rect x="34" y="-80" width="28" height="80" rx="10" fill="#174a4b" stroke="#7dd3c7" stroke-opacity=".4"/>
    <rect x="34" y="-60" width="28" height="16" fill="#3c8579"/>
    <rect x="34" y="-30" width="28" height="10" fill="#fbbf24" opacity=".9"/>
  </g>

  <!-- Compass -->
  <g transform="translate(770 250)" opacity=".75">
    <circle r="46" fill="none" stroke="#5eead4" stroke-opacity=".35"/>
    <circle r="36" fill="none" stroke="#5eead4" stroke-opacity=".2"/>
    <g class="needle">
      <path d="M0-30 10 0 0 30-10 0z" fill="#f59e0b" opacity=".85"/>
      <path d="M0-30 0 30" stroke="#0b242b" stroke-width="2"/>
    </g>
    <text x="0" y="-54" text-anchor="middle" fill="#bdf5e8" font-family="Manrope, sans-serif" font-size="12" letter-spacing="3">N</text>
  </g>

  <!-- Floating particles -->
  <g class="particles" fill="#5eead4" opacity=".5">
    <circle cx="120" cy="360" r="2"/><circle cx="810" cy="520" r="2.4"/><circle cx="700" cy="150" r="1.8"/>
    <circle cx="180" cy="610" r="2.2"/><circle cx="850" cy="760" r="1.6"/><circle cx="90" cy="880" r="2"/>
    <circle cx="420" cy="520" r="1.6"/><circle cx="560" cy="700" r="2"/><circle cx="330" cy="260" r="1.8"/>
  </g>

  <!-- Vignette -->
  <rect width="900" height="1200" fill="url(#bg)" opacity=".12"/>
</svg>
